server:
  error:
    include-message: always
  port: 8080
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:30}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:3}

spring:
  datasource:
    url: jdbc:h2:mem:recruitment_bot;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

logging:
  level:
    root: INFO
    com.example.recruitmentbot: INFO

integration:
  enabled: ${INTEGRATION_API_ENABLED:true}
  api-key: ${INTEGRATION_API_KEY:}
facebook:
  verify-token: your-facebook-verify-token
  page-access-token: your-facebook-page-access-token
  send-api-url: https://graph.facebook.com/v23.0/me/messages
  hr:
    enabled: ${FACEBOOK_HR_CONSOLE_ENABLED:true}
  job-posting:
    enabled: ${FACEBOOK_JOB_POSTING_ENABLED:true}
    page-id: ${FACEBOOK_PAGE_ID:1109946045541973}
    page-access-token: ${FACEBOOK_PAGE_POST_ACCESS_TOKEN:EAAcgcmjJBO0BRtN6fBr2E21XF0gHcsaBvfvKfJh8VUHuwnxGWPq3u7Iqreq4ZAm4sMZADf0lXZBB76PQM5reZBRIFBfrg39sB8zqJXCxZB69WFYOU0xn17rcTqgQWbTVVZBaT2Pq5ZCwRg8uAA6rz0FOPwe9Isc31K8bR1tKBLgIXhhwFoWplo9juSCuSoWseoPMZBTZCuIsoKZBJwxllgVyKb9pBzaQZDZD}
    graph-api-base-url: ${FACEBOOK_GRAPH_API_BASE_URL:https://graph.facebook.com/v23.0}
    repost-cron: ${FACEBOOK_JOB_REPOST_CRON:0 0 8 ? * MON-FRI}
  group-posting:
    enabled: ${FACEBOOK_GROUP_POSTING_ENABLED:true}
    scheduler-enabled: ${FACEBOOK_GROUP_POSTING_SCHEDULER_ENABLED:false}
    scheduler-cron: ${FACEBOOK_GROUP_POSTING_CRON:0 30 8 ? * MON,WED}
    open-claw-script-name: ${FACEBOOK_GROUP_POSTING_OPENCLAW_SCRIPT_NAME:facebookGroupPost}
    delay-min-seconds: ${FACEBOOK_GROUP_POSTING_DELAY_MIN_SECONDS:15}
    delay-max-seconds: ${FACEBOOK_GROUP_POSTING_DELAY_MAX_SECONDS:90}
    max-posts-per-day-per-group: ${FACEBOOK_GROUP_POSTING_MAX_POSTS_PER_DAY_PER_GROUP:10}
    retry-count: ${FACEBOOK_GROUP_POSTING_RETRY_COUNT:2}
    rpa-tools-invoke-url: ${FACEBOOK_GROUP_POSTING_RPA_TOOLS_INVOKE_URL:http://127.0.0.1:18990/tools/invoke}
    rpa-auth-token: ${FACEBOOK_GROUP_POSTING_RPA_AUTH_TOKEN:${OPENCLAW_GATEWAY_TOKEN:}}
    rpa-connect-timeout-seconds: ${FACEBOOK_GROUP_POSTING_RPA_CONNECT_TIMEOUT_SECONDS:10}
    rpa-read-timeout-seconds: ${FACEBOOK_GROUP_POSTING_RPA_READ_TIMEOUT_SECONDS:180}
    candidate-cta-enabled: ${FACEBOOK_GROUP_POSTING_CANDIDATE_CTA_ENABLED:true}
    candidate-fanpage-name: ${FACEBOOK_GROUP_POSTING_CANDIDATE_FANPAGE_NAME:Test VCS}
    candidate-fanpage-url: ${FACEBOOK_GROUP_POSTING_CANDIDATE_FANPAGE_URL:}
    candidate-cta-template: |
      Để biết thông tin chi tiết và ứng tuyển, vui lòng nhắn tin trực tiếp fanpage {{fanpageName}}{{fanpageUrlLine}}.
      Vui lòng không inbox tài khoản cá nhân của HR để tránh bỏ sót thông tin ứng tuyển.

openai:
  mode: OLLAMA
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4.1-mini
  responses-url: https://api.openai.com/v1/responses
  system-prompt: >
    You are a recruitment assistant for a company's hiring team.
    Reply to candidates in a professional, friendly, concise tone.
    Keep answers focused on recruitment-related questions and next steps.

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:qwen2.5:3b}
  generate-api-path: ${OLLAMA_GENERATE_API_PATH:/api/generate}
  job-post-model: ${OLLAMA_JOB_POST_MODEL:${OLLAMA_MODEL:qwen2.5:3b}}
  connect-timeout-seconds: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:10}
  read-timeout-seconds: ${OLLAMA_READ_TIMEOUT_SECONDS:120}
  system-prompt: >
    You are a recruitment assistant for a company's hiring team.
    Reply in Vietnamese when the candidate writes in Vietnamese.
    Reply in English when the candidate writes in English.
    Keep answers professional, friendly, concise, and strictly focused on recruitment topics.
    If the candidate asks outside recruitment scope, redirect them back to hiring-related questions.
  job-post-prompt-template: |
    Ban la recruitment copywriter cho fanpage doanh nghiep.
    Hay viet lai du lieu tuyen dung tho thanh 1 bai dang Facebook bang tieng Viet, am ap, chuyen nghiep, de thu hut ung vien.
    Bat buoc:
    - Chi tra ve duy nhat noi dung bai dang cuoi cung, san sang de dang len Facebook.
    - Khong giai thich, khong markdown fence, khong mo dau bang "Duoi day la".
    - Co emoji phu hop.
    - Co cac phan ro rang: gioi thieu vi tri, mo ta cong viec, yeu cau, muc luong/quyen loi, dia diem, hinh thuc lam viec, call-to-action.
    - Neu thong tin ngan gon thi duoc phep dien dat lai cho tu nhien hon nhung khong duoc tu tao su that ngoai du lieu dau vao.
    Du lieu dau vao:
    Tieu de: {{title}}
    Mo ta: {{description}}
    Yeu cau: {{requirements}}
    Muc luong: {{salary}}
    Dia diem: {{location}}
    Hinh thuc lam viec: {{workType}}
    Trang thai: {{status}}

openclaw:
  enabled: ${OPENCLAW_ENABLED:true}
  base-url: ${OPENCLAW_BASE_URL:http://127.0.0.1:18889}
  gateway-token: ${OPENCLAW_GATEWAY_TOKEN:}
  wsl-distro: ${OPENCLAW_WSL_DISTRO:Ubuntu-24.04}
  default-model: ${OPENCLAW_DEFAULT_MODEL:openclaw/default}
  default-agent-id: ${OPENCLAW_DEFAULT_AGENT_ID:main}
  health-path: ${OPENCLAW_HEALTH_PATH:/}
  responses-path: ${OPENCLAW_RESPONSES_PATH:/v1/responses}
  tools-invoke-path: ${OPENCLAW_TOOLS_INVOKE_PATH:/tools/invoke}
  connect-timeout-seconds: ${OPENCLAW_CONNECT_TIMEOUT_SECONDS:10}
  read-timeout-seconds: ${OPENCLAW_READ_TIMEOUT_SECONDS:90}
  token-resolve-timeout-seconds: ${OPENCLAW_TOKEN_RESOLVE_TIMEOUT_SECONDS:20}

topcv:
  webhook:
    enabled: ${TOPCV_WEBHOOK_ENABLED:true}
    require-api-key: ${TOPCV_WEBHOOK_REQUIRE_API_KEY:false}
    api-key: ${TOPCV_WEBHOOK_API_KEY:}
    api-key-header-name: ${TOPCV_WEBHOOK_API_KEY_HEADER_NAME:X-TopCV-Api-Key}
    auth-query-param-name: ${TOPCV_WEBHOOK_AUTH_QUERY_PARAM_NAME:apiKey}

interview:
  enabled: ${INTERVIEW_SCHEDULING_ENABLED:true}
  hr-recipient-id: ${INTERVIEW_HR_RECIPIENT_ID:REPLACE_ME}
  default-department: ${INTERVIEW_DEFAULT_DEPARTMENT:Engineering}
  interview-location: ${INTERVIEW_LOCATION:VCS office - interview room 3}
  preparation-notes: ${INTERVIEW_PREPARATION_NOTES:Mang theo CV cap nhat va den truoc 10 phut.}
  slot-offer-count: ${INTERVIEW_SLOT_OFFER_COUNT:3}
  soft-lock-minutes: ${INTERVIEW_SOFT_LOCK_MINUTES:15}
  hr-response-timeout-minutes: ${INTERVIEW_HR_RESPONSE_TIMEOUT_MINUTES:120}
  council-response-timeout-minutes: ${INTERVIEW_COUNCIL_RESPONSE_TIMEOUT_MINUTES:360}
  slot-selection-prompt-template: |
    You receive offered interview slots and one candidate reply.
    Decide which single option the candidate means.
    Return exactly one line and nothing else, using one of these formats:
    SELECT:<option_number>
    RESCHEDULE
    UNSURE
    AMBIGUOUS
    NO_MATCH
    Use RESCHEDULE if the candidate asks for another slot or another day.
    Use UNSURE if the candidate is hesitant or asks for advice.
    Use AMBIGUOUS if more than one option fits the reply.
    Use NO_MATCH if the reply does not map to any offered slot.
    Offered slots:
    {{options}}
    Candidate reply:
    {{reply}}

